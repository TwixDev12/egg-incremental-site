<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="eggGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Glow Aura -->
  <ellipse cx="50" cy="52" rx="34" ry="42" fill="url(#eggGrad)" opacity="0.3" filter="url(#glow)"/>

  <!-- Cosmic Egg Shape -->
  <ellipse cx="50" cy="52" rx="30" ry="38" fill="url(#eggGrad)"/>

  <!-- Specular Highlight -->
  <ellipse cx="42" cy="36" rx="8" ry="12" fill="#ffffff" opacity="0.45" transform="rotate(-15 42 36)"/>

  <!-- Orbital Energy Ring -->
  <ellipse cx="50" cy="54" rx="42" ry="14" fill="none" stroke="url(#ringGrad)" stroke-width="4.5" transform="rotate(-12 50 54)"/>
  
  <!-- Energy Nodes -->
  <circle cx="12" cy="62" r="3.5" fill="#fef08a"/>
  <circle cx="88" cy="46" r="3.5" fill="#fef08a"/>
</svg>